      expected_category: refund
      expected_priority: P2
    assert:
      - type: contains
        value: "{{order_id}}"
        metric: 订单
      - type: is-valid-openai-tools-call
        transform: JSON.parse(output).tool_calls || []
        weight: 0.5
        metric: 工具
      - type: javascript
        metric: 工具
        weight: 0.5
        value: |-
          const calls = JSON.parse(output).tool_calls || [];
          return calls.some((c) => c.function.name === "lookup_order");
      - type: levenshtein
        value: —— 青檐家居售后 · 阿檐
        threshold: 2
        transform: JSON.parse(output).reply.trim().split('\n').pop()
        metric: 署名
    threshold: 0.87
