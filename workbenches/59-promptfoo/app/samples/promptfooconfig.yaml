# 青檐家居售后助手 · 发布评测（Floatboat Promptfoo 评测台示例）
# 36 个工单（24 中文 + 12 英文）× 3 个提示版本 × 2 个录制模型 + 1 个规则脚本基线。
# “recorded:*” provider 回放示例录制输出：这些输出由工作台作者编写用于演示，不是真实模型的回答。
# 把 provider 换成 floatboat:<模型>（例如 floatboat:gemini-3.8-flash）即可让 Floatboat 真实生成并重新评分。
description: 青檐家居售后助手 · 发布评测（示例录制输出为人工编写，非真实模型回答）
prompts:
  - label: v1 现网
    raw: |-
      你是“青檐家居”跨境店铺的售后助手。阅读一条客户工单，判断分类与优先级并起草回复。
      - 分类 category 只能是：refund、return、shipping、damaged、account、invoice、complaint、other。
      - 优先级 priority：涉及人身安全、盗刷/重复扣款、法律追责为 P1；影响使用或时效的为 P2；咨询类为 P3。
      - 回复使用客户的语言（lang），不承诺具体赔偿金额，不复述客户的电话号码，结尾另起一行署名。
      只输出一个 JSON 对象：{"category": ..., "priority": ..., "reply": ...}

      渠道：{{channel}}　语言：{{lang}}　订单号：{{order_id | default("无", true)}}
      工单：
      {{ticket}}
  - label: v2 结构化+工具
    raw: |-
      你是“青檐家居”跨境店铺的售后助手。阅读一条客户工单，判断分类与优先级并起草回复。
      - 分类 category 只能是：refund、return、shipping、damaged、account、invoice、complaint、other。
      - 优先级 priority：涉及人身安全、盗刷/重复扣款、法律追责为 P1；影响使用或时效的为 P2；咨询类为 P3。
      - 回复使用客户的语言（lang），不承诺具体赔偿金额，不复述客户的电话号码，结尾另起一行署名。
      - 同时给出一句话摘要 summary（与回复同语言）。
      - 需要查订单、创建退换货或转人工时，在 tool_calls 中按 OpenAI tools 格式给出调用；不需要时给空数组。
      只输出一个 JSON 对象，字段依次为 category、priority、summary、reply、tool_calls，不要使用 Markdown 代码块。

      渠道：{{channel}}
      语言：{{lang}}
      {% if order_id %}订单号：{{order_id}}
      {% endif %}工单：
      {{ticket}}
  - label: v3 精简
    raw: |-
      售后分诊（青檐家居）。分类：refund/return/shipping/damaged/account/invoice/complaint/other；P1=安全/扣款/法律，P2=影响使用，P3=咨询。
      输出 JSON：category, priority, summary, reply（{{lang}}，结尾署名，不复述电话），tool_calls（OpenAI tools 格式，可为空）。
      {% if order_id %}订单 {{order_id}}。{% endif %}工单（{{channel}}）：{{ticket}}
providers:
  - id: recorded:assistant-large
    label: 大模型 · 示例录制
    config:
      tools: &a1
        - type: function
          function:
            name: lookup_order
            description: 查询订单、物流与退款状态
            parameters:
              type: object
              properties:
                order_id:
                  type: string
                  pattern: ^QY\d{8}$
              required:
                - order_id
              additionalProperties: false
        - type: function
          function:
            name: create_return
            description: 创建退货、换货或补发申请
            parameters:
              type: object
              properties:
                order_id:
                  type: string
                  pattern: ^QY\d{8}$
                kind:
                  type: string
                  enum:
                    - return
                    - exchange
                    - reship
                    - warranty
              required:
                - order_id
                - kind
              additionalProperties: false
        - type: function
          function:
            name: escalate_to_human
            description: 转交人工专员
            parameters:
              type: object
              properties:
                team:
                  type: string
                  enum:
                    - safety
                    - payments
                    - relations
                    - security
                    - quality
                priority:
                  type: string
                  enum:
                    - P1
                    - P2
                    - P3
              required:
                - team
                - priority
              additionalProperties: false
  - id: recorded:assistant-small
    label: 小模型 · 示例录制
    config:
      tools: *a1
  - id: floatboat:script
    label: 规则分诊脚本
    prompts:
      - v1 现网
    config:
      code: |-
        const t = String(context.vars.ticket).toLowerCase();
        const has = (...w) => w.some((x) => t.includes(x));
        let category = "other";
        if (has("退款", "refund", "扣", "charged", "优惠券")) category = "refund";
        else if (has("退货", "换", "return", "exchange", "收到的是", "received a")) category = "return";
        else if (has("物流", "快递", "发货", "签收", "地址", "tracking", "delivery", "parcel")) category = "shipping";
        else if (has("破", "裂", "漏", "冒烟", "缺", "broken", "scratch", "spark")) category = "damaged";
        else if (has("发票", "invoice")) category = "invoice";
        else if (has("登录", "账号", "积分", "验证码", "password", "log in")) category = "account";
        else if (has("投诉", "律师", "态度", "complain", "unacceptable", "manager")) category = "complaint";
        const urgent = has("冒烟", "起火", "律师", "盗", "扣了两次", "冻结", "spark", "charged twice", "breaker");
        const priority = urgent ? "P1" : category === "other" ? "P3" : "P2";
        const en = context.vars.lang === "English";
        const order = context.vars.order_id;
        const reply = en
          ? (order ? "Order " + order + ": " : "") + "Thanks for contacting us. Our team will review your request within 24 hours.\n— Qingyan Home Support"
          : "您好，" + (order ? "订单 " + order + " " : "") + "已收到您的反馈，我们会在 24 小时内处理。\n—— 青檐家居售后 · 阿檐";
        return JSON.stringify({ category, priority, reply });
defaultTest:
  assert:
    - type: is-json
      metric: 格式
      value:
        type: object
        required:
          - category
          - priority
          - reply
        properties:
          category:
            enum:
              - refund
              - return
              - shipping
              - damaged
              - account
              - invoice
              - complaint
              - other
          priority:
            enum:
              - P1
              - P2
              - P3
          reply:
            type: string
            minLength: 8
    - type: starts-with
      value: "{"
      weight: 0.5
      metric: 格式
    - type: javascript
      value: JSON.parse(output).category === context.vars.expected_category
      weight: 2
      metric: 分类
    - type: javascript
      value: JSON.parse(output).priority === context.vars.expected_priority
      weight: 3
      metric: 优先级
    - type: javascript
      value: JSON.parse(output).reply.length <= 220
      metric: 简洁
    - type: not-icontains-any
      value:
        - 作为AI
        - 作为一个AI
        - as an AI
        - 保证全额
        - guaranteed full refund
      metric: 合规
    - type: not-regex
      value: 1[3-9]\d{9}
      metric: 隐私
    - type: latency
      threshold: 2500
      metric: 性能
    - type: cost
      threshold: 0.0025
      metric: 成本
tests:
  - description: zh-01 退款三天未到账
    vars:
      channel: 站内信
      lang: 中文
      order_id: QY20261018
