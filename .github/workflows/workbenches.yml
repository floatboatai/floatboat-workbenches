name: Workbench packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      scope:
        description: "changed: only workbenches changed since the last successful run; all: rebuild and resubmit every verified workbench"
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

concurrency:
  group: workbenches-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      count: ${{ steps.catalog.outputs.count }}
      releases: ${{ steps.catalog.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - name: Test repository tooling
        run: node --test scripts/tests/*.test.mjs
      # Main compares with the last successful run, so a cancelled or failed run's
      # changes are carried forward instead of skipped. Tags and scope=all build everything.
      - name: Choose comparison base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$SCOPE" != all ]; then
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/workbenches.yml/runs?branch=main&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // ""')" || base=""
          fi
          if [ -n "$base" ] && ! git fetch --quiet --no-tags --depth=1 origin "$base"; then
            base=""
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select changed workbenches and new versions
        id: catalog
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          node scripts/ci-workbenches.mjs plan ${BASE:+--base "$BASE"} > "$RUNNER_TEMP/plan.json"
          {
            echo "matrix=$(jq -c '{include}' "$RUNNER_TEMP/plan.json")"
            echo "count=$(jq '.include | length' "$RUNNER_TEMP/plan.json")"
            echo "releases=$(jq -c '.releases' "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Workbench plan"
            echo "Base: ${BASE:-none (full build)}"
            echo "Build: $(jq -r '[.include[].slug] | join(", ") | if . == "" then "none" else . end' "$RUNNER_TEMP/plan.json")"
            echo "Release: $(jq -r '.releases | join(", ") | if . == "" then "none" else . end' "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: catalog
    if: needs.catalog.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    env:
      WORKBENCH_SLUG: ${{ matrix.slug }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.22.0"
          cache: true
          cache_dependency_path: ${{ matrix.directory }}/pnpm-lock.yaml
      - name: Prepare pinned official toolchain
        run: pnpm workbench prepare "$WORKBENCH_SLUG"
      - name: Check application
        run: pnpm workbench check "$WORKBENCH_SLUG"
      - name: Test application
        run: pnpm workbench test "$WORKBENCH_SLUG"
      - name: Package application and introduction image
        run: node scripts/ci-workbenches.mjs package "$WORKBENCH_SLUG" "$RUNNER_TEMP/workbenches/$WORKBENCH_SLUG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-${{ matrix.slug }}
          path: ${{ runner.temp }}/workbenches/${{ matrix.slug }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  upload:
    needs: [catalog, package]
    if: >-
      vars.FLOATBOAT_UPLOAD_ENABLED == 'true' &&
      needs.catalog.outputs.releases != '[]' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workbench-*
          path: ${{ runner.temp }}/workbench-artifacts
      - name: Upload with the official account
        env:
          FLOATBOAT_UPLOAD_URL: ${{ secrets.FLOATBOAT_UPLOAD_URL }}
          FLOATBOAT_UPLOAD_API_KEY: ${{ secrets.FLOATBOAT_UPLOAD_API_KEY }}
          FLOATBOAT_PUBLISH_ENABLED: ${{ vars.FLOATBOAT_PUBLISH_ENABLED }}
          FLOATBOAT_RELEASE_SLUGS: ${{ needs.catalog.outputs.releases }}
        run: node scripts/upload-workbenches.mjs "$RUNNER_TEMP/workbench-artifacts"
