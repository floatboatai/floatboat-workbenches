name: Workbench packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbenches-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - name: Test repository tooling
        run: node --test scripts/tests/*.test.mjs
      - name: Select locally verified workbenches
        id: catalog
        run: |
          matrix="$(node scripts/ci-workbenches.mjs matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    env:
      WORKBENCH_SLUG: ${{ matrix.slug }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.22.0"
          cache: true
          cache_dependency_path: ${{ matrix.directory }}/pnpm-lock.yaml
      - name: Prepare pinned official toolchain
        run: pnpm workbench prepare "$WORKBENCH_SLUG"
      - name: Check application
        run: pnpm workbench check "$WORKBENCH_SLUG"
      - name: Test application
        run: pnpm workbench test "$WORKBENCH_SLUG"
      - name: Package application and introduction image
        run: node scripts/ci-workbenches.mjs package "$WORKBENCH_SLUG" "$RUNNER_TEMP/workbenches/$WORKBENCH_SLUG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-${{ matrix.slug }}
          path: ${{ runner.temp }}/workbenches/${{ matrix.slug }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  upload:
    needs: [catalog, package]
    if: >-
      vars.FLOATBOAT_UPLOAD_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workbench-*
          path: ${{ runner.temp }}/workbench-artifacts
      - name: Upload with the official account
        env:
          FLOATBOAT_UPLOAD_URL: ${{ secrets.FLOATBOAT_UPLOAD_URL }}
          FLOATBOAT_UPLOAD_API_KEY: ${{ secrets.FLOATBOAT_UPLOAD_API_KEY }}
        run: node scripts/upload-workbenches.mjs "$RUNNER_TEMP/workbench-artifacts"
